<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Dominio de Banderas - Burnout Games</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050608">
    <link rel="icon" type="image/png" href="images/resources/logoBurnout-3.png" />
    <link rel="apple-touch-icon" href="images/resources/logoBurnout-3.png">
    <link rel="manifest" href="burnoutgames.webmanifest">
    <link rel="stylesheet" href="assets/css/burnoutgames_dominio.css">
  </head>
  <body>
    <main class="dominio-page" aria-label="Juego Dominio de banderas">
      <section class="dominio-board">
        <div class="dominio-counter" id="dominioCounter" aria-live="polite">00:00</div>

        <div class="police-controls" aria-label="Control de dominio">
          <button class="police-button police-button--red" type="button" data-team="red" aria-label="Activar equipo rojo"></button>
          <button class="police-button police-button--blue" type="button" data-team="blue" aria-label="Activar equipo azul"></button>
        </div>
      </section>
    </main>
    <script src="assets/js/burnoutgames_dominio.js"></script>
    <script src="assets/js/burnoutgames_pwa.js"></script>
  </body>
</html>
