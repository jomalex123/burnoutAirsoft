<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Bomba C4 - Burnout Games</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/png" href="images/resources/logoBurnout-3.png" />
    <link rel="stylesheet" href="assets/css/burnoutgames_c4.css">
  </head>
  <body>
    <main class="c4-page" aria-label="Juego Bomba C4">
      <section class="bomb-device" aria-label="Pantalla de bomba">
        <div class="bomb-device__body">
          <div class="bomb-shell-details" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="bomb-leds" aria-hidden="true">
            <span class="bomb-led bomb-led--red"></span>
            <span class="bomb-led bomb-led--yellow"></span>
            <span class="bomb-led bomb-led--green"></span>
          </div>
          <div class="bomb-top-panel" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="bomb-lcd" role="status" aria-live="polite">
            <div class="bomb-lcd__top">
              <span id="bombMode">STANDBY</span>
              <span id="bombSignal">LINK OFF</span>
            </div>
            <div class="bomb-time" id="bombTime">05:00</div>
            <div class="bomb-entry" id="bombEntry">_</div>
            <div class="bomb-message" id="bombMessage">CODIGO DE DESACTIVACION</div>
          </div>
          <div class="bomb-port" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="bomb-keypad" aria-label="Teclado bomba">
            <button type="button" data-bomb-key="7">7</button>
            <button type="button" data-bomb-key="8">8</button>
            <button type="button" data-bomb-key="9">9</button>
            <button type="button" data-bomb-key="4">4</button>
            <button type="button" data-bomb-key="5">5</button>
            <button type="button" data-bomb-key="6">6</button>
            <button type="button" data-bomb-key="1">1</button>
            <button type="button" data-bomb-key="2">2</button>
            <button type="button" data-bomb-key="3">3</button>
            <button class="key-muted" type="button" data-bomb-action="clear">*</button>
            <button type="button" data-bomb-key="0">0</button>
            <button class="key-ok" type="button" data-bomb-action="submit">#</button>
          </div>
          <div class="bomb-bottom-panel" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </section>
    </main>
    <script src="assets/js/burnoutgames_c4.js"></script>
  </body>
</html>
