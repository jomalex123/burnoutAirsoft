services:
  web:
    build: .
    container_name: burnoutairsoft
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      BURNOUT_ENV: local
      BURNOUT_ENV_FILE: /var/www/html/docker/env.php
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: burnoutairsoft-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: burnout_root
      MYSQL_DATABASE: 11364681_burnoutairsoft
      MYSQL_USER: boutAdmin
      MYSQL_PASSWORD: Asdqwe123
    ports:
      - "3306:3306"
    volumes:
      - burnoutairsoft_mysql_db:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pburnout_root"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  burnoutairsoft_mysql_db:
